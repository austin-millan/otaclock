# OtaClock2 CI/CD (Go / Ebitengine)
#
# Stages:
#   test    — go vet + go test + Linux build verification
#   release — cross-compiled binaries (Linux/Windows/macOS) + docker publish
#
# Because the Go port cross-compiles Windows and macOS with CGO_ENABLED=0, every
# release artifact is produced from a single Linux runner. Only the native Linux
# build needs CGO and the GL/X11 dev headers.
#
# Container registry: registry.gitlab.com/austin-millan/otaclock
# Docker Hub: aamillan/otaclock (set CI/CD variables DOCKERHUB_USER, DOCKERHUB_SECRET)
# Runners: tag `linux` (Docker executor); docker:publish needs the host socket.

stages:
  - test
  - release

variables:
  GO_VERSION: "1.26"
  RELEASE_VERSION: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
  DOCKER_REGISTRY_IMAGE: "registry.gitlab.com/austin-millan/otaclock"
  DOCKERHUB_IMAGE: "aamillan/otaclock"
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  # Ebitengine cross-compiles to Windows with CGO_ENABLED=0, but its macOS GLFW
  # backend still needs CGO — so the macOS artifact requires a real Mac runner.
  SKIP_MACOS: "true"

.rules-all:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.rules-release:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rules-docker-publish:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

.go:
  tags: [linux]
  image: "golang:${GO_VERSION}-bookworm"
  variables:
    GOPATH: "${CI_PROJECT_DIR}/.gopath"
  cache:
    key: go-mod
    paths:
      - .gopath/pkg/mod
  before_script:
    - bash scripts/ci/install-linux-build-deps.sh
    - chmod +x scripts/ci/*.sh
    - go version

.docker-host:
  tags: [linux]
  image: docker:24-cli
  before_script:
    - test -S /var/run/docker.sock || (echo "Mount /var/run/docker.sock in runner config.toml" >&2 && exit 1)

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------

test:
  extends:
    - .go
    - .rules-all
  stage: test
  script:
    - go vet ./...
    - go test ./...

build:linux:
  extends:
    - .go
    - .rules-all
  stage: test
  variables:
    CGO_ENABLED: "1"
  script:
    - go build -trimpath -o dist/otaclock2 .

