docker:publish:
  extends:
    - .docker-host
    - .rules-docker-publish
  stage: release
  needs:
    - job: test
    - job: build:linux
  script:
    - |
      IMAGE="${CI_REGISTRY_IMAGE:-${DOCKER_REGISTRY_IMAGE}}"
      TAG="${CI_COMMIT_SHORT_SHA}"
      docker build --build-arg GO_VERSION="${GO_VERSION}" --build-arg VERSION="${RELEASE_VERSION}" -t "${IMAGE}:${TAG}" .
      sh scripts/ci/docker-export-and-push.sh "${IMAGE}:${TAG}"
  artifacts:
    name: "otaclock2-docker-${RELEASE_VERSION}"
    paths:
      - dist/docker-push-tags.txt
      - dist/dockerhub-push-tags.txt
      - dist/docker-image-info.txt
      - dist/otaclock2-docker-*.tar
    expire_in: 30 days
